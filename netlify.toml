[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API redirects to Netlify Functions
[[redirects]]
  from = "/api/focus-break/request"
  to = "/.netlify/functions/request-break"
  status = 200

[[redirects]]
  from = "/api/focus-break/verify"
  to = "/.netlify/functions/verify-break"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
